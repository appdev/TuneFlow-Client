name: Build TuneFlow clients

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the compiled artifacts as a GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.0
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore Android signing key
        if: ${{ inputs.publish_release }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tuneflow-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/tuneflow-release.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Build validation APK
        if: ${{ !inputs.publish_release }}
        run: flutter build apk --debug --dart-define="SENTRY_DSN=$SENTRY_DSN"
      - name: Build signed Release APK
        if: ${{ inputs.publish_release }}
        run: flutter build apk --release --dart-define="SENTRY_DSN=$SENTRY_DSN"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tuneflow-android-apk
          path: ${{ inputs.publish_release && 'build/app/outputs/flutter-apk/app-release.apk' || 'build/app/outputs/flutter-apk/app-debug.apk' }}
          if-no-files-found: error

  ios:
    name: iOS unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define="SENTRY_DSN=$SENTRY_DSN"
      - name: Remove iOS ad-hoc signatures
        shell: bash
        run: |
          app=build/ios/iphoneos/Runner.app
          strip_signature() {
            codesign --remove-signature "$1" 2>/dev/null || true
          }
          strip_signature "$app"
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              strip_signature "$binary"
            fi
          done < <(find "$app" -type f -print0)
      - name: Verify Apple binaries are unsigned
        shell: bash
        run: |
          app=build/ios/iphoneos/Runner.app
          verify_unsigned() {
            if codesign -dv "$1" >/dev/null 2>&1; then
              echo "::error file=$1::Code object still has a signature"
              return 1
            fi
          }
          verify_unsigned "$app"
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              verify_unsigned "$binary"
            fi
          done < <(find "$app" -type f -print0)
      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app tuneflow-ios-unsigned.zip
      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: tuneflow-ios-unsigned
          path: tuneflow-ios-unsigned.zip
          if-no-files-found: error

  macos:
    name: macOS ad-hoc signed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build ad-hoc signed macOS app
        run: flutter build macos --release --dart-define="SENTRY_DSN=$SENTRY_DSN"
      - name: Verify macOS ad-hoc signature
        shell: bash
        run: |
          app=build/macos/Build/Products/Release/TuneFlow.app
          codesign --verify --deep --strict --verbose=4 "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -q '^Signature=adhoc$' <<< "$signature"
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/TuneFlow.app tuneflow-macos-unsigned.zip
      - name: Verify packaged macOS signature
        shell: bash
        run: |
          unpacked=$(mktemp -d "$RUNNER_TEMP/tuneflow-macos.XXXXXX")
          ditto -x -k tuneflow-macos-unsigned.zip "$unpacked"
          codesign --verify --deep --strict --verbose=4 "$unpacked/TuneFlow.app"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: tuneflow-macos-unsigned
          path: tuneflow-macos-unsigned.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define="SENTRY_DSN=$env:SENTRY_DSN"
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tuneflow-windows.zip
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: tuneflow-windows
          path: tuneflow-windows.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --verbose --dart-define="SENTRY_DSN=$SENTRY_DSN"
      - name: Package Linux app
        run: tar -C build/linux/x64/release -czf tuneflow-linux.tar.gz bundle
      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: tuneflow-linux
          path: tuneflow-linux.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release }}
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate release tag
        shell: bash
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          test -n "$version"
          RELEASE_TAG="v$version"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          test -f release-assets/app-release.apk
          test -f release-assets/tuneflow-ios-unsigned.zip
          test -f release-assets/tuneflow-macos-unsigned.zip
          test -f release-assets/tuneflow-windows.zip
          test -f release-assets/tuneflow-linux.tar.gz
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            release-assets/app-release.apk \
            release-assets/tuneflow-ios-unsigned.zip \
            release-assets/tuneflow-macos-unsigned.zip \
            release-assets/tuneflow-windows.zip \
            release-assets/tuneflow-linux.tar.gz
